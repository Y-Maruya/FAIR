run:
  input: /eos/experiment/faser/raw/2026/021722/FaserAHCAL-Physics-021722-00000.raw
  MC: false
  log_file: out_calibration/pedestal_calib/log
  output: out_calibration/pedestal_calib/###run-number###/out.root
  nEvents: -1
  log_level: INFO
  runNumber: ###run-number###
  poolIndex: 0
reader: 
  type: BinaryRawHitReader
  cfg:
    out_rawhits_key: RawHits
    out_tlu_key: TLURawData
  # type: RootRawHitReader
  # cfg:
  #   out_rawhits_key: RawHits
  #   out_tlu_key: TLURawData
  # type: RootInput
  # cfg:
  #   inputlist: 
  #     - [vector<AHCALRawHit>, RawHits]
  #     - [AHCALTLURawData, TLURawData]
  #     - [vector<AHCALRecoHit>, RecoHits]
  #     - [SimpleFittedTrack, FittedTrack]
  #     - [Track, MuonKFTrack]

algs: # Define the sequence of algorithms to be executed. The order matters.
  - type: PedestalAlg
    cfg:
      in_rawhit_key: RawHits
      pedestal_to_file: true
      pedestal_to_DB: true
      out_pedestal_filename: out_calibration/pedestal_calib/###run-number###/pedestal.root
      out_json_dirname: out_calibration/pedestal_calib/###run-number###/json/
      use_hittag: false
      select_hittag: 0
      nbin: 800
      xmin: 0
      xmax: 800
      hg_cut_failed: true
      hg_cut_rms_per_sigma: true
      hg_max_rms_per_sigma: 4.0
      hg_cut_max_sigma_and_max_rms: true
      hg_max_sigma: 20.0
      hg_max_rms: 35.0
      hg_cut_sigma_vs_chi2: false
      lg_cut_failed: true
      lg_cut_max_sigma: true
      lg_max_sigma: 4.0