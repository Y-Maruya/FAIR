algs: # Define the sequence of algorithms to be executed. The order matters.
  # - type: PedestalAlg
  #   cfg:
  #     in_rawhit_key: RawHits
  #     pedestal_to_file: true
  #     pedestal_to_DB: false
  #     out_pedestal_filename: out/run21659/ped.root
  #     use_hittag: false
  #     select_hittag: 0
  - type: AdcToEnergyReadTTreeAlg
    cfg:
      in_rawhit_key: RawHits
      out_recohit_key: RecoHits
      mip:
        file: /afs/cern.ch/user/y/ymaruya/private/FASERlink/AHCAL/FAIR/calibration/reffiles/mip.root
        cut: (gaus_sigma>20)
        cellid_version: 0
      pedestal:
        file: /afs/cern.ch/user/y/ymaruya/private/FASERlink/AHCAL/FAIR/calibration/pedestal_calib/run21722/pedestal.root
        cut: (1)
        cellid_version: 1
      dac:
        file: /afs/cern.ch/user/y/ymaruya/private/FASERlink/AHCAL/FAIR/calibration/reffiles/dac.root
        cut: (1)
        cellid_version: 0
  - type: RmIsolatedHitAlg
    cfg:
      in_recohit_key: RecoHits
      out_recohit_key: RmIsolatedHits
      useNmipWindow: false
      xy_cone: 42.0
      maxMissingLayers: 0
  - type: TrackFitAlg
    cfg:
      in_recohit_key: RmIsolatedHits
      out_track_key: FittedTrack
      use_mip_window: true
      nmipMin: 0.5
      nmipMax: 3.0
      threshold_xy: 20.0
