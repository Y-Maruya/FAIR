run:
  input: /afs/cern.ch/user/y/ymaruya/private/FASERlink/AHCAL/FAIR/out/SimMuon/out4.root
  MC: true
  log_file: /afs/cern.ch/user/y/ymaruya/private/FASERlink/AHCAL/FAIR/out/SimMuon/log_2nd
  output: /afs/cern.ch/user/y/ymaruya/private/FASERlink/AHCAL/FAIR/out/SimMuon/out.root
  nEvents: -1
  log_level: INFO
  runNumber: 10000
  poolIndex: 0
reader: 
