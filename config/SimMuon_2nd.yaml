  type: RootInput
  cfg:
    inputlist: 
        - [vector<AHCALRawHit>, SimRawHits]
        # - [vector<AHCALSimHit>, SimHits]
        - [SimData, SimData]
        - [SimpleFittedTrack, FittedTrack]

