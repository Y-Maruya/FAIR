run:
  input: /eos/experiment/faser/raw/2026/0###run-number###/FaserAHCAL-Physics-0###run-number###-0*.raw
  MC: false
  log_file: /afs/cern.ch/user/y/ymaruya/private/FASERlink/AHCAL/FAIR/out_calibration/intercalib_calib/###run-numbers###/log
  output: /eos/project/f/faser-upgrade/AHCAL/FAIR/###run-numbers###.root
  nEvents: -1
  log_level: INFO
  runNumber: ###run-number###
  poolIndex: 0
reader:
  type: BinaryRawHitReader
  cfg:
    out_rawhits_key: RawHits
    out_tlu_key: TLURawData
algs:
- type: InterCalibAlg
  cfg:
    in_rawhit_key: RawHits
    read_pedestal_from_ROOT: false
    read_pedestal_from_DB: true
    intercalib_to_file: true
    intercalib_to_DB: true
    hg_bin_width: 25.0
    out_intercalib_filename: /afs/cern.ch/user/y/ymaruya/private/FASERlink/AHCAL/FAIR/out_calibration/intercalib_calib/###run-numbers###/intercalib_adj.root
    out_json_dirname: /afs/cern.ch/user/y/ymaruya/private/FASERlink/AHCAL/FAIR/out_calibration/intercalib_calib/###run-numbers###/json/
    save_all_channels_root: false
    require_hittag: true
    hg_fit_max: 1800.0
    hg_fit_min: 50.0
    use_specific_fit_range_toL39C8: true
    hg_fit_max_L39C8: 1500.0
    save_residual_histograms: false
    compute_quality_metrics: true
    # Minimum number of points required for a channel to have valid fit
    quality_minimum_points: 30

    # Thresholds for quality flags
    quality_bad_correlation_threshold: 0.6      # Min correlation to pass
    quality_outlier_fraction_threshold: 0.2     # Max fraction of outliers
    quality_slope_layer_z_threshold: 5.0        # Max |z-score| for slope
    quality_chi2_ndf_threshold: 10.0            # Max chi2/ndf

    # TTree output options
    quality_output_ttree: true                       # Enable TTree output
    quality_out_filename: "/afs/cern.ch/user/y/ymaruya/private/FASERlink/AHCAL/FAIR/out_calibration/intercalib_calib/###run-numbers###/hglg_calib_quality.root"  # Output file name
    quality_save_summary_plots: false                # Generate summary histograms (future)
