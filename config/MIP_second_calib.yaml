#   cfg:
#     out_rawhits_key: RawHits
#     out_tlu_key: TLURawData
  # type: RootRawHitReader
  # cfg:
  #   out_rawhits_key: RawHits
  #   out_tlu_key: TLURawData
  type: RootInput
  cfg:
    inputlist: 
      - [vector<AHCALRawHit>, RawHits]
      # - [AHCALTLURawData, TLURawData]
      # - [vector<AHCALRecoHit>, RecoHits]
      - [SimpleFittedTrack, FittedTrack]
      # - [Track, MuonKFTrack]

