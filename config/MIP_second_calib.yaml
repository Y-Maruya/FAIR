run:
  input: ${FAIR_ROOT_OUT}/###run-number###_MIPCalib.root
  MC: false
  log_file: ${FAIR_OUT_CALIB}/mip_calib_run_dual/###run-numbers###/log
  output: ${FAIR_ROOT_OUT}/###run-number###_MIPCalib.root
  nEvents: -1
  log_level: INFO
  runNumber: ###run-number###
  poolIndex: 0
reader: 
