        cut: (1)
        cellid_version: 0
  - type: RmIsolatedHitAlg
    cfg:
      in_recohit_key: RecoHits
      out_recohit_key: RmIsolatedHits
      useNmipWindow: false
      xy_cone: 42.0
      maxMissingLayers: 2
  - type: TrackFitAlg
    cfg:
      in_recohit_key: RmIsolatedHits
      out_track_key: FittedTrack
      use_mip_window: false
      nmipMin: 0.5
      nmipMax: 3.0
      threshold_xy: 20.0
  - type: InterCalibAlg
    cfg:
      in_rawhit_key: RawHits
      read_pedestal_from_ROOT: false
      read_pedestal_from_DB: true
      intercalib_to_file: true
      intercalib_to_DB: true
      hg_bin_width: 25.0
