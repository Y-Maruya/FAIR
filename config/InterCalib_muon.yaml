run:
  input: /eos/experiment/faser/raw/2026/0###run-number###/FaserAHCAL-Physics-0###run-number###-0*.raw
  MC: false
  log_file: /afs/cern.ch/user/y/ymaruya/private/FASERlink/AHCAL/FAIR/out_calibration/intercalib_calib/###run-numbers###/log_muon
  output: /eos/project/f/faser-upgrade/AHCAL/FAIR/###run-numbers###.root
  nEvents: -1
  log_level: INFO
  runNumber: ###run-number###
  poolIndex: 0
reader:
  type: BinaryRawHitReader
  cfg:
    out_rawhits_key: RawHits
    out_tlu_key: TLURawData
algs:
  - type: AdcToEnergyReadTTreeAlg
    cfg:
      in_rawhit_key: RawHits
      out_recohit_key: RecoHits
      mip:
        file: /afs/cern.ch/user/y/ymaruya/private/FASERlink/AHCAL/FAIR/calibration/reffiles/mip.root
        cut: (gaus_sigma>20)
        cellid_version: 0
      pedestal:
        file: /afs/cern.ch/user/y/ymaruya/private/FASERlink/AHCAL/FAIR/calibration/pedestal_calib/run21722/pedestal.root
        cut: (1)
        cellid_version: 1
      dac:
        file: /afs/cern.ch/user/y/ymaruya/private/FASERlink/AHCAL/FAIR/calibration/reffiles/dac.root
        cut: (1)
        cellid_version: 0
  - type: RmIsolatedHitAlg
    cfg:
      in_recohit_key: RecoHits
      out_recohit_key: RmIsolatedHits
      useNmipWindow: false
      xy_cone: 42.0
      maxMissingLayers: 2
  - type: TrackFitAlg
    cfg:
      in_recohit_key: RmIsolatedHits
      out_track_key: FittedTrack
      use_mip_window: false
      nmipMin: 0.5
      nmipMax: 3.0
      threshold_xy: 20.0
  - type: InterCalibAlg
    cfg:
      in_rawhit_key: RawHits
      read_pedestal_from_ROOT: false
      read_pedestal_from_DB: true
      intercalib_to_file: true
      intercalib_to_DB: true
      hg_bin_width: 25.0
      out_intercalib_filename: /afs/cern.ch/user/y/ymaruya/private/FASERlink/AHCAL/FAIR/out_calibration/intercalib_calib/###run-numbers###/intercalib_adj_muon.root
      out_json_dirname: /afs/cern.ch/user/y/ymaruya/private/FASERlink/AHCAL/FAIR/out_calibration/intercalib_calib/###run-numbers###/json_muon/
      save_all_channels_root: false
      require_hittag: true
      select_muon_hits: true
      in_track_key: FittedTrack
      string_track_struct: SimpleFittedTrack
      track_selection_string: (valid>0)*(chi2xperndf<5)*(chi2xperndf>0)*(chi2yperndf<5)*(chi2yperndf>0)*(direction_y<0.1)*(direction_y>-0.1)*(direction_x<0.1)*(direction_x>-0.1)  
      hg_fit_max: 1800.0
      use_fit_max_saturation_minus_margin: true
      saturation_margin: 600.0
      hg_fit_min: 50.0
      use_specific_fit_range_toL39C8: true
      hg_fit_max_L39C8: 1500.0
      save_residual_histograms: false
      compute_quality_metrics: true
      # Minimum number of points required for a channel to have valid fit
      quality_minimum_points: 30

      # Thresholds for quality flags
      quality_bad_rms_persigma_threshold: 1.15

      # TTree output options
      quality_output_ttree: true                       # Enable TTree output
      quality_out_filename: "/afs/cern.ch/user/y/ymaruya/private/FASERlink/AHCAL/FAIR/out_calibration/intercalib_calib/###run-numbers###/hglg_calib_quality_muon.root"  # Output file name
      quality_save_summary_plots: false                # Generate summary histograms (future)
